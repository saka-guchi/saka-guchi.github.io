name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: junior-vet-exam-chart/package.json

      - name: Install dependencies
        working-directory: ./junior-vet-exam-chart
        run: npm ci

      - name: Type check
        working-directory: ./junior-vet-exam-chart
        run: npx tsc -b

      - name: Run tests
        working-directory: ./junior-vet-exam-chart
        run: npm test

      - name: Build Junior Vet App
        working-directory: ./junior-vet-exam-chart
        env:
          VITE_BASE_PATH: /junior-vet-exam-chart/
        run: npm run build

      - name: Prepare Site for GitHub Pages
        run: |
          mkdir -p _site
          touch _site/.nojekyll
          # Copy root portal
          if [ -f index.html ]; then
            cp index.html _site/index.html
          fi
          # Copy lab-vocab if present
          if [ -d lab-vocab ]; then
            cp -r lab-vocab _site/lab-vocab
          fi
          # Copy built junior-vet-exam-chart
          cp -r junior-vet-exam-chart/dist _site/junior-vet-exam-chart

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
